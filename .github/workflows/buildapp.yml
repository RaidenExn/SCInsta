name: Build and Package SCInsta

on:
    workflow_dispatch:
        inputs:
            decrypted_instagram_url:
                description: "The direct URL to the decrypted Instagram IPA"
                default: ""
                required: true
                type: string
            upload_artifact:
                description: "Upload Artifact"
                default: true
                required: false
                type: boolean
            ipa_name:
                description: "App Name / Output IPA Name"
                default: "Instagram"
                required: false
                type: string
            package_name:
                description: "Bundle ID / Package Name (Leave blank for default)"
                default: ""
                required: false
                type: string
            add_extensions:
                description: "Keep App Extensions (PlugIns/Watch apps)"
                default: false
                required: false
                type: boolean
            keep_english_only:
                description: "Remove all language files except English"
                default: true
                required: false
                type: boolean
  
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build SCInsta
        runs-on: macos-latest
        permissions:
            contents: write

        steps:
            - name: Checkout Main
              uses: actions/checkout@v4
              with:
                path: main
                submodules: recursive

            - name: Install Dependencies
              run: brew install ldid dpkg make

            - name: Set PATH environment variable
              run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH 

            - name: Setup Theos
              uses: actions/checkout@v4
              with:
                repository: theos/theos
                ref: master
                path: ${{ github.workspace }}/theos
                submodules: recursive
        
            - name: SDK Caching
              id: SDK
              uses: actions/cache@v4
              env:
                cache-name: iPhoneOS16.2.sdk
              with:
                path: ${{ github.workspace }}/theos/sdks/
                key: ${{ env.cache-name }}
                restore-keys: ${{ env.cache-name }}

            - name: Download iOS SDK
              if: steps.SDK.outputs.cache-hit != 'true'
              run: |
                git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
                cd iOS-SDKs
                git sparse-checkout set --no-cone iPhoneOS16.2.sdk
                git checkout
                mv *.sdk $THEOS/sdks
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Prepare and Pre-process Instagram IPA
              run: |
                cd main

                mkdir -p packages
                wget "$Instagram_URL" --no-verbose -O packages/com.burbn.instagram.ipa

                # --- PRE-PROCESSING LOGIC ---
                cd packages
                unzip -q com.burbn.instagram.ipa -d extracted_ipa

                if [ "${{ inputs.add_extensions }}" = "false" ]; then
                  echo "Removing App Extensions to prevent signing issues..."
                  rm -rf extracted_ipa/Payload/*.app/PlugIns
                  rm -rf extracted_ipa/Payload/*.app/Extensions
                  rm -rf extracted_ipa/Payload/*.app/Watch
                  rm -rf extracted_ipa/Payload/*.app/com.apple.WatchPlaceholder
                fi

                if [ "${{ inputs.keep_english_only }}" = "true" ]; then
                  echo "Removing non-English language files to reduce size..."
                  # Broadened search to the entire Payload to catch lproj files hidden in Frameworks
                  find extracted_ipa/Payload -type d -name "*.lproj" ! -name "en.lproj" ! -name "Base.lproj" -exec rm -rf {} +
                fi

                if [ -n "${{ inputs.package_name }}" ]; then
                  echo "Modifying Bundle Identifier to ${{ inputs.package_name }}..."
                  /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${{ inputs.package_name }}" extracted_ipa/Payload/*.app/Info.plist || true
                fi

                if [ "${{ inputs.ipa_name }}" != "Instagram" ]; then
                  echo "Modifying App Display Name to ${{ inputs.ipa_name }}..."
                  /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${{ inputs.ipa_name }}" extracted_ipa/Payload/*.app/Info.plist || true
                  /usr/libexec/PlistBuddy -c "Set :CFBundleName ${{ inputs.ipa_name }}" extracted_ipa/Payload/*.app/Info.plist || true
                fi

                # --- THE FIX ---
                # Delete the original downloaded IPA so 'zip' is forced to create a fresh, 
                # slim archive instead of updating the old bloated one.
                rm com.burbn.instagram.ipa
                
                # Repackage into the exact file name build.sh expects
                cd extracted_ipa
                zip -qr ../com.burbn.instagram.ipa Payload
                cd ..
                rm -rf extracted_ipa
                cd ..
                
              env:
                THEOS: ${{ github.workspace }}/theos
                Instagram_URL: ${{ inputs.decrypted_instagram_url }}

            - name: Get SCInsta Version
              id: scinsta_version
              run: |
                SCINSTA_VERSION=$(awk '/Version:/ {print $2}' main/control)
                echo "SCINSTA_VERSION=${SCINSTA_VERSION}" >> "$GITHUB_ENV"
                echo "version=${SCINSTA_VERSION}" >> "$GITHUB_OUTPUT"
            
            - name: Build SCInsta tweak for sideloading (as IPA)
              run: |
                pip install --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
                
                cd main
                curl -Lo ipapatch https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.macos-arm64
                chmod +x ipapatch
                export PATH=.:$PATH

                ./build.sh sideload
                
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Rename IPA to include custom name and version
              run: |
                cd main/packages
                # Fix: Explicitly target the known output file rather than guessing
                mv SCInsta-sideloaded.ipa "${{ inputs.ipa_name }}_sideloaded_v${SCINSTA_VERSION}.ipa"

            - name: Upload Artifact
              if: ${{ inputs.upload_artifact }}
              uses: actions/upload-artifact@v4
              with:
                name: ${{ inputs.ipa_name }}_sideloaded_v${{ steps.scinsta_version.outputs.version }}
                path: main/packages/${{ inputs.ipa_name }}_sideloaded_v${{ steps.scinsta_version.outputs.version }}.ipa
                if-no-files-found: error

            - name: Create Release
              uses: softprops/action-gh-release@v2.0.6
              with:
                # Fix: A tag_name is REQUIRED for GH Actions to successfully create a release from a manual workflow
                tag_name: v${{ steps.scinsta_version.outputs.version }}-build${{ github.run_number }}
                name: ${{ inputs.ipa_name }} Sideloaded v${{ steps.scinsta_version.outputs.version }}
                # Fix: Explicitly pass the renamed .ipa file
                files: main/packages/${{ inputs.ipa_name }}_sideloaded_v${{ steps.scinsta_version.outputs.version }}.ipa
                draft: true

            - name: Output Release URL
              run: |
                echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
