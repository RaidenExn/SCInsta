name: Build and Package SCInsta

on:
  workflow_dispatch:
    inputs:
      use_latest_cached_ipa:
        description: "✅ Use the most recently cached IPA (Ignores URL and Version below)"
        type: boolean
        default: false
      decrypted_instagram_url:
        description: "URL to IPA (Required only if not using latest cache)"
        required: false
      ipa_version:
        description: "Version of IPA (Required only if not using latest cache)"
        required: false
      display_name:
        description: "Custom App Name (e.g., SCInsta)"
        default: "Instagram"
        required: true
        type: string
      bundle_id:
        description: "Custom BundleID (e.g., com.user.scinsta)"
        default: "com.burbn.instagram"
        required: true
        type: string
      keep_share_extension:
        description: "✅ Keep the Share Extension"
        type: boolean
        default: false
      keep_widget_extension:
        description: "✅ Keep the Widget Extension"
        type: boolean
        default: false
      keep_notification_extension:
        description: "✅ Keep the Notification Extension"
        type: boolean
        default: false
      keep_liveactivities_extension:
        description: "✅ Keep the Live Activities Extension"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SCInsta
    runs-on: macos-latest
    permissions:
      contents: write
      actions: read 

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          path: main
          submodules: recursive

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: display_name,bundle_id,keep_share_extension,keep_widget_extension,keep_notification_extension,keep_liveactivities_extension

      - name: Install Dependencies
        run: brew install ldid dpkg make

      - name: Set PATH environment variable
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Find Latest Cached IPA
        if: inputs.use_latest_cached_ipa == 'true'
        id: find_latest_cache
        run: |
          LATEST_KEY=$(gh cache list --key decrypted-ipa-v --sort created_at --order desc | head -n 1 | awk '{print $1}')
          echo "key=$LATEST_KEY" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Fail if no cache found when requested
        if: inputs.use_latest_cached_ipa == 'true' && steps.find_latest_cache.outputs.key == ''
        run: |
          echo "::error::'Use latest cache' was selected, but no cached IPAs were found."
          exit 1
          
      - name: Cache Theos
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-cache-${{ runner.os }}

      - name: Setup Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Cache iOS SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: iphoneos-14.5-sdk

      - name: Download iOS SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS14.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Restore or Save Decrypted IPA
        id: ipa_cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/main/packages/instagram.ipa
          key: ${{ inputs.use_latest_cached_ipa == 'true' && steps.find_latest_cache.outputs.key || format('decrypted-ipa-v{0}-{1}', inputs.ipa_version, runner.os) }}

      - name: Download and Validate Instagram IPA
        if: steps.ipa_cache.outputs.cache-hit != 'true' && inputs.use_latest_cached_ipa == 'false'
        run: |
          if [ -z "${{ inputs.decrypted_instagram_url }}" ]; then
            echo "::error::IPA was not found in cache, and no download URL was provided."
            exit 1
          fi
          mkdir -p ${{ github.workspace }}/main/packages
          wget "${{ inputs.decrypted_instagram_url }}" --no-verbose -O "${{ github.workspace }}/main/packages/instagram.ipa"
          
          file_type=$(file --mime-type -b "${{ github.workspace }}/main/packages/instagram.ipa")
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA."
            exit 1
          fi
          echo "IPA validation successful."

      - name: Determine IPA Version for Naming
        id: set_ipa_version
        run: |
          if [ "${{ inputs.use_latest_cached_ipa }}" == "true" ]; then
            VERSION=$(echo "${{ steps.find_latest_cache.outputs.key }}" | sed -E 's/decrypted-ipa-v([0-9.]+)-.*/\1/')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.ipa_version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Get SCInsta Version
        id: scinsta_version
        run: |
          SCINSTA_VERSION=$(awk '/Version:/ {print $2}' main/control)
          echo "version=${SCINSTA_VERSION}" >> "$GITHUB_OUTPUT"
      
      # --- NEW DEBUGGING STEP ---
      - name: Debug Directory
        run: |
          echo "Checking contents of main/packages directory before build:"
          ls -l ${{ github.workspace }}/main/packages
          
      - name: Build SCInsta tweak for sideloading (as IPA)
        run: |
          pip install --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          
          cd main
          ./build.sh sideload
        env:
          THEOS: ${{ github.workspace }}/theos
          APP_NAME: ${{ inputs.display_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          KEEP_SHARE: ${{ inputs.keep_share_extension }}
          KEEP_WIDGET: ${{ inputs.keep_widget_extension }}
          KEEP_NOTIFICATION: ${{ inputs.keep_notification_extension }}
          KEEP_LIVEACTIVITIES: ${{ inputs.keep_liveactivities_extension }}

      - name: Prepare IPA for Release
        id: final_ipa
        run: |
          cd main/packages
          LATEST_IPA=$(ls -t *.ipa | head -n1)
          FINAL_NAME="SCInsta_v${{ steps.scinsta_version.outputs.version }}_i${{ steps.set_ipa_version.outputs.version }}.ipa"
          mv "$LATEST_IPA" "$FINAL_NAME"
          echo "path=${{ github.workspace }}/main/packages/${FINAL_NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${FINAL_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scinsta-${{ github.run_number }}
          name: SCInsta v${{ steps.scinsta_version.outputs.version }} (Instagram v${{ steps.set_ipa_version.outputs.version }})
          files: ${{ steps.final_ipa.outputs.path }}
          draft: true
          
      - name: Output Release URL
        run: |
          echo "::notice::Draft release created. Find it at: https://github.com/${{ github.repository }}/releases"
