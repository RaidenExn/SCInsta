name: Build and Package SCInsta

on:
  workflow_dispatch:
    inputs:
      decrypted_instagram_url:
        description: "The direct URL to the decrypted Instagram IPA"
        required: true
        type: string
      display_name:
        description: "Custom App Name (e.g., SCInsta)"
        default: "Instagram"
        required: true
        type: string
      bundle_id:
        description: "Custom BundleID (e.g., com.user.scinsta)"
        default: "com.burbn.instagram"
        required: true
        type: string
      remove_share_extension:
        description: "Remove Share Extension"
        type: boolean
        default: false
      remove_widget_extension:
        description: "Remove Widget Extension"
        type: boolean
        default: false
      remove_notification_extension:
        description: "Remove Notification Extension"
        type: boolean
        default: false
      remove_liveactivities_extension:
        description: "Remove Live Activities Extension"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SCInsta
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          path: main
          submodules: recursive

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: display_name,bundle_id,remove_share_extension,remove_widget_extension,remove_notification_extension,remove_liveactivities_extension

      - name: Install Dependencies
        run: brew install ldid dpkg make

      - name: Set PATH environment variable
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Cache Theos
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-cache-${{ runner.os }}

      - name: Setup Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Cache iOS SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: iphoneos-14.5-sdk

      - name: Download iOS SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone iPhoneOS14.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Download and Validate Instagram IPA
        run: |
          mkdir -p ${{ github.workspace }}/main/packages
          wget "${{ inputs.decrypted_instagram_url }}" --no-verbose -O "${{ github.workspace }}/main/packages/instagram.ipa"
          
          file_type=$(file --mime-type -b "${{ github.workspace }}/main/packages/instagram.ipa")
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi
          echo "IPA validation successful."

      - name: Get SCInsta Version
        id: scinsta_version
        run: |
          SCINSTA_VERSION=$(awk '/Version:/ {print $2}' main/control)
          echo "SCINSTA_VERSION=${SCINSTA_VERSION}" >> "$GITHUB_ENV"
          echo "version=${SCINSTA_VERSION}" >> "$GITHUB_OUTPUT"
          
      - name: Build SCInsta tweak for sideloading (as IPA)
        run: |
          pip install --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          
          cd main
          ./build.sh sideload
        env:
          THEOS: ${{ github.workspace }}/theos
          APP_NAME: ${{ inputs.display_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          REMOVE_SHARE: ${{ inputs.remove_share_extension }}
          REMOVE_WIDGET: ${{ inputs.remove_widget_extension }}
          REMOVE_NOTIFICATION: ${{ inputs.remove_notification_extension }}
          REMOVE_LIVEACTIVITIES: ${{ inputs.remove_liveactivities_extension }}

      - name: Prepare IPA for Release
        id: final_ipa
        run: |
          cd main/packages
          LATEST_IPA=$(ls -t *.ipa | head -n1)
          FINAL_NAME="SCInsta_v${{ steps.scinsta_version.outputs.version }}.ipa"
          mv "$LATEST_IPA" "$FINAL_NAME"
          echo "path=${{ github.workspace }}/main/packages/${FINAL_NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${FINAL_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scinsta-${{ github.run_number }}
          name: SCInsta v${{ steps.scinsta_version.outputs.version }} (Build #${{ github.run_number }})
          files: ${{ steps.final_ipa.outputs.path }}
          draft: true
          
      - name: Output Release URL
        run: |
          echo "::notice::Draft release created. Find it at: https://github.com/${{ github.repository }}/releases"
